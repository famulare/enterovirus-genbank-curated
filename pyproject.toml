[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "enterovirus-genbank-curated"
version = "0.0.0"
description = "Reproducibility pipeline for the enterovirus-genbank-curated data release"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Mike Famulare" }]
# Pinned exactly: these versions produced the v2.1.5 baseline the parity gate compares against,
# and GenBank parse output is version-sensitive.
dependencies = [
    "biopython==1.87",
    "duckdb==1.5.5",
]

[project.scripts]
evgc = "enterovirus_genbank_curated.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -m 'not slow'"
testpaths = ["tests"]
markers = [
    "slow: exercises the full 25,727-record corpus; run with -m slow",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
