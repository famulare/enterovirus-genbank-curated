name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      # Fast tier. Includes the undeclared-input guard tests, each of which runs in a subprocess
      # because audit hooks cannot be uninstalled. Most assert a violation is refused; a handful are
      # positive controls asserting legitimate work still succeeds, so they must keep *passing* when
      # the guard is neutered — do not read them as falsified checks. The reproducible evidence that
      # the refusals bite is tests/test_sandbox.py itself: neuter a rule in sandbox.py and its
      # matching test fails. docs/reproducibility.md additionally records a planted-mutation battery,
      # but that is prose, not a runnable artifact — do not cite it as the check. This tier proves
      # the guard's mechanism, not the real build.
      - name: Test
        run: python -m pytest
      #
      # There is deliberately no separate `evgc validate-contracts` step. The tier above already runs
      # `validate_contracts` against the real tree with full baseline verification, via
      # tests/test_contracts.py::test_repository_contracts_validate — a step here would re-hash the
      # shipped release a second time to reach the same assertions. Removed 2026-07-30.
      #
      # Known consequence: `validate-contracts` joins `validate-ledger` and `build-source` as cli.py
      # branches no CI job executes. Only `parity-source` is, by the guarded corpus test below — the
      # sole test that shells out to the CLI at all. So this step was covering one of three otherwise
      # unexercised branches, which is worth more than the assertions it duplicated. If that coverage
      # is wanted back, the proportionate fix is a fast test per branch calling `cli.main([...])`
      # directly — `validate-contracts --skip-baseline-verification` costs milliseconds — rather than
      # a step that re-hashes all of final/ to reach conclusions pytest already reached.
      #
      # The corpus tier: reparse all 25,727 records from raw/ and compare every source artifact
      # against the hashes the release manifest declares. ~40s, so it belongs on every push. When
      # the pipeline grows a multi-hour alignment stage this must split into its own scheduled
      # workflow.
      #
      # Neither `evgc parity-source` nor `evgc parity-source --guard-inputs` is a separate step, on
      # purpose. This tier already invokes both: `test_the_real_source_build_runs_clean_under_the
      # _guard` shells out to the guarded CLI against the real corpus and asserts both PASS lines.
      # Adding a step would run a second full corpus build for no extra coverage. If you are here to
      # add one, check that test first.
      - name: Test against the full corpus
        run: python -m pytest -m slow

  # site/data/ is built by pages.yml at deploy time and is not committed, so "are the
  # committed artifacts stale?" is no longer a question anyone can get wrong — there
  # are none. What is worth catching before a merge is the pipeline failing outright,
  # or producing artifacts the figures cannot read, since either would now break the
  # deploy rather than a hash check. This job runs the same build Pages runs.
  site-pipeline-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build site/data/ from final/
        run: uv run --no-project site/pipeline/cli.py build
      # Metric and tree correctness: synthetic cases with hand-computed answers, plus
      # assertions against the shipped artifacts. Without this step the selftest would
      # only ever run when someone remembered to run it.
      - name: Selftest the site pipeline
        run: uv run --no-project site/pipeline/cli.py selftest
      # pages.yml runs only on push to main, so without these the typecheck and the
      # site tests never see a pull request. That was survivable while site/data/ was
      # committed and hash-gated here; now the deploy would be the first place a
      # broken bundle showed up, and it would show up already published.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
        working-directory: site
      - name: Typecheck
        run: npm run check
        working-directory: site
      - name: Test
        run: npm test
        working-directory: site
