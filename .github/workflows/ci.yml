name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      # Fast tier. Includes the undeclared-input guard tests, each of which runs in a subprocess
      # because audit hooks cannot be uninstalled. Most assert a violation is refused; a handful are
      # positive controls asserting legitimate work still succeeds, so they must keep *passing* when
      # the guard is neutered — do not read them as falsified checks. The reproducible evidence that
      # the refusals bite is tests/test_sandbox.py itself: neuter a rule in sandbox.py and its
      # matching test fails. docs/reproducibility.md additionally records a planted-mutation battery,
      # but that is prose, not a runnable artifact — do not cite it as the check. This tier proves
      # the guard's mechanism, not the real build.
      - name: Test
        run: python -m pytest
      - name: Validate repository contracts
        run: evgc validate-contracts
      # The corpus tier: reparse all 25,727 records from raw/ and compare every source artifact
      # against the hashes the release manifest declares. ~40s, so it belongs on every push. When
      # the pipeline grows a multi-hour alignment stage this must split into its own scheduled
      # workflow.
      #
      # Neither `evgc parity-source` nor `evgc parity-source --guard-inputs` is a separate step, on
      # purpose. This tier already invokes both: `test_the_real_source_build_runs_clean_under_the
      # _guard` shells out to the guarded CLI against the real corpus and asserts both PASS lines.
      # Adding a step would run a second full corpus build for no extra coverage. If you are here to
      # add one, check that test first.
      - name: Test against the full corpus
        run: python -m pytest -m slow

  # The site publishes committed, precomputed artifacts rather than recomputing on
  # deploy, so the failure mode worth engineering against is a figure built from
  # data that has since changed. This job makes that impossible to land quietly.
  site-data-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Rebuild rather than `check`. `check` only asks whether manifest.json is
      # self-consistent with what is on disk, and that is satisfiable two ways:
      # rebuild the artifacts, or hand-edit the stamp. It cannot tell them apart, so
      # editing a pipeline module's logic and re-stamping publishes stale figures
      # behind a green tick. Rebuilding and diffing asks the question that matters —
      # are the committed artifacts what these sources over this data actually
      # produce — and strictly subsumes `check`, which is why there is no check step.
      #
      # Costs ~4.5 min against ~3 min for the other job, which runs in parallel, so it
      # sets the wall time for the workflow. If it grows enough to hurt, gate it on
      # changes to site/pipeline/**, site/data/**, final/** and raw/** rather than
      # weakening it — a rebuild that does not run proves nothing.
      - name: Rebuild site/data/ from final/
        run: uv run --no-project site/pipeline/cli.py build
      # -I skips a manifest hunk whose every changed line is the recorded Python
      # patch version. That field is provenance, not gated content: build_identity is
      # derived from input and source hashes only, and check() ignores it too. uv
      # resolves any 3.12-3.13 interpreter under the PEP 723 header, so gating on it
      # would fail CI for the runner's Python rather than for the data. Verified that
      # a real change alongside a version drift is still caught.
      - name: Assert the committed artifacts are exactly what the build produces
        run: git diff --exit-code -I'"python": ' -- site/data/
      # Metric and tree correctness: synthetic cases with hand-computed answers, plus
      # assertions against the shipped artifacts. Without this step the selftest would
      # only ever run when someone remembered to run it.
      - name: Selftest the site pipeline
        run: uv run --no-project site/pipeline/cli.py selftest
