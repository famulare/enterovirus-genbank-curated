name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # final/ and raw/ are inputs to the published artifacts now that this job
      # builds them, so a data refresh has to republish. While site/data/ was
      # committed, a refresh reached the page only via the rebuilt artifacts under
      # site/**, and forgetting to rebuild meant the page silently kept the old
      # numbers. It cannot now: the release is republished from whatever final/
      # holds at the commit that changed it.
      - "final/**"
      - "raw/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Both the data and the bundle are built here. site/data/ used to be committed and
# hash-gated, on the reasoning that this job should stay free of any bioinformatics
# toolchain — but there is no such toolchain: the pipeline's only dependency is
# numpy, declared inline in cli.py, and it reads nothing outside final/ and raw/.
# Building it here makes this runner the single producer of the published artifacts,
# which is what makes them trustworthy now that we know the build is not
# byte-reproducible across platforms.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should replace an older one, not cancel a run mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Must precede every npm step: build.mjs refuses to bundle without the data,
      # and site/test reads the real artifacts rather than fixtures on purpose, so a
      # pipeline change that desynchronizes payload and renderer fails the tests.
      - name: Build site/data/ from final/
        run: uv run --no-project site/pipeline/cli.py build
      # 24, not 22: `npm test` runs the TypeScript sources directly and relies on
      # Node stripping their types without a flag, which is only unconditional from
      # 23.6 on. Also declared in site/package.json engines.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
        working-directory: site
      - name: Typecheck
        run: npm run check
        working-directory: site
      - name: Test
        run: npm test
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
