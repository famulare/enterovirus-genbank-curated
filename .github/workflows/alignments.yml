name: Alignments

# The expensive half of the alignment layer, deliberately kept out of `ci.yml`. A full build runs the
# native aligners over 24,305 records and takes hours; `ci.yml` keeps only the toolchain-free checks
# so every push stays fast. If you are about to add a mafft step to `ci.yml`, this is the workflow it
# belongs in.
#
# Not a build trigger. `workflow_dispatch` rebuilds on request, and the path filter below fires when
# something that could change an artifact changes. Neither commits anything: a human commits a
# regeneration, exactly as `site/data/` already works.
#
# A weekly `schedule` sat here from 2026-07-31 to 2026-11-09, justified as drift detection. It could
# not detect anything. Every input to this build is a committed file: `raw/` has changed twice in the
# repository's life, `sandbox.py` refuses the network outright, and the lock is pinned with
# `locked: true`. A dependency bump or a lockfile change *is* a commit, and the path filter below
# already names every file one could touch. Fourteen Sundays produced fourteen red runs and no
# information — and taught the mailbox to ignore this workflow, which is how the one genuinely
# different failure sat unread for a week.

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: "One artifact name, or empty for all six"
        required: false
        default: ""
  pull_request:
    paths:
      - "src/enterovirus_genbank_curated/align/**"
      - "src/enterovirus_genbank_curated/export/alignment.py"
      - "src/enterovirus_genbank_curated/validation/alignment.py"
      - "src/enterovirus_genbank_curated/sandbox*.py"
      - "registry/toolchain.json"
      - "registry/alignment_seeds/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/alignments.yml"

permissions:
  contents: read

concurrency:
  # One build at a time per ref. Concurrent aligner processes are what exhausted memory on a real
  # machine, and while separate runners do not share RAM, a queued rerun of the same ref is waste.
  group: alignments-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fails in ~2 minutes on a lock/declaration disagreement, before anything expensive starts.
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: align
          locked: true
          cache: true
      - name: Tools match the declaration and the lock
        run: pixi run -e align evgc alignment-toolchain
      - name: The committed covariance-model core is intact
        run: pixi run -e align evgc alignment-verify-seeds

  build:
    needs: toolchain
    runs-on: ubuntu-latest
    # The hosted ceiling is 360. EV is the long pole at 232 minutes locally on eight threads, and a
    # hosted runner has four cores, so the margin here is real but not large. No hosted run has ever
    # finished EV, so that is a projection, not a measurement: if a dispatch run times out, raise
    # this against what it reports rather than assuming the build regressed.
    timeout-minutes: 330
    strategy:
      # Every artifact reports, so one failure does not hide the other five.
      fail-fast: false
      matrix:
        artifact:
          - POLIO_unified
          - NPEV_unified
          - EV_unified
          - PV1_unified
          - PV2_unified
          - PV3_unified
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: align
          locked: true
          cache: true

      # One artifact per job. The matrix parallelises across runners, which do not share memory, and
      # within a runner the build is strictly sequential by construction. That is the property the
      # 50 GB freeze taught, and it is a property of *artifact* sequencing, not of the thread count.
      #
      # So the thread count is left at the declared `DEFAULT_THREADS`. This step passed `--threads 1`
      # from 2026-07-31 to 2026-11-09, written thirty-one minutes before `align/build.py` measured
      # the question and recorded the opposite under "Threads are not the memory problem, and one
      # thread is a trap": 58 MB at one thread against 582 MB at eight, both negligible, and pinning
      # one only serialises the stage that parallelises. It cost POLIO 9-12x — 25.6 minutes locally
      # against 3h41-5h04 here — and put EV and NPEV beyond any timeout this workflow could carry.
      # It is also a declared parameter recorded in provenance, so the override built at a thread
      # count the release does not carry.
      - name: Build ${{ matrix.artifact }}
        run: |
          pixi run -e align evgc alignment-build \
            --output-dir derived/alignments \
            --artifact ${{ matrix.artifact }}

      # The gate needs no aligner, but running it here means a build that produces a malformed
      # artifact fails in the job that produced it rather than somewhere downstream.
      - name: Verify ${{ matrix.artifact }} against metadata
        run: |
          pixi run -e align evgc alignment-verify \
            --output-dir derived/alignments \
            --artifact ${{ matrix.artifact }}

      - name: Shape report and declared delta for ${{ matrix.artifact }}
        run: |
          pixi run -e align evgc alignment-shape \
            --output-dir derived/alignments \
            --artifact ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: alignment-${{ matrix.artifact }}
          path: derived/alignments/
          if-no-files-found: error

  # Reports drift; never commits. The cross-artifact set identities can only be checked here,
  # because they are statements about several artifacts at once and each build job has only one.
  gather:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          environments: align
          locked: true
          cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: alignment-*
          merge-multiple: true
          path: derived/alignments
      - name: Every artifact, including the cross-artifact set identities
        run: pixi run -e align evgc alignment-verify --output-dir derived/alignments
      - name: Declared delta against the shipped release
        run: pixi run -e align evgc alignment-shape --output-dir derived/alignments
      - uses: actions/upload-artifact@v4
        with:
          name: alignment-shape-report
          path: |
            derived/alignments/shape_report.json
            derived/alignments/shape_report.md
          if-no-files-found: error
